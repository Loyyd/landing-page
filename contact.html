<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact & Signup - NoteWave</title>
    <link rel="stylesheet" href="./css/styles.css">
</head>
<body>
    <header>
        <nav>
            <a href="./index.html" class="logo">
                <img src="./images/notewave_logo.png" alt="NoteWave Logo">
                NoteWave
            </a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="market.html">Market</a></li>
                <li><a href="business.html">Business</a></li>
                <li><a href="team.html">Team</a></li>
                <li><a href="contact.html" class="active">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <div class="form-container">
            <h2 style="text-align: center; color: var(--primary-blue);">Join the Waitlist</h2>
            <p style="text-align: center; margin-bottom: 2rem; color: #495057;">Sign up today to get early access to NoteWave and <strong>1 month of Premium for free!</strong></p>
            
            <form action="#" method="POST" onsubmit="event.preventDefault(); alert('Thank you for joining the waitlist!');">
                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" name="name" required placeholder="Max Mustermann">
                </div>
                <div class="form-group">
                    <label for="email">University Email</label>
                    <input type="email" id="email" name="email" required placeholder="maxmustermann@mail.dcu.ie">
                </div>
                <div class="form-group">
                    <label for="university">University</label>
                    <input type="text" id="university" name="university" required placeholder="e.g. Dublin City University">
                </div>
                <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">Submit</button>
            </form>
        </div>
    </main>

    <footer id="footer-layout">
        <div class="footer-container">
            <p class="footer-text footer-copyright">&copy; 2026 NoteWave. All rights reserved.</p>
            <div class="footer-meta">
                <a href="https://www.instagram.com/notewave_ac/?hl=en" target="_blank" rel="noreferrer">
                    <img src="images/Instagram_icon.png" alt="" class="footer-social-icon">
                    <span>Follow us on Instagram</span>
                </a>
            </div>

            <div class="footer-newsletter">
                <p class="footer-kicker">Join our newsletter</p>
                <h2></h2>
                <form class="footer-newsletter-form" action="https://formspree.io/f/xdkwqnnb" method="post">
                    <label class="sr-only" for="newsletter-name">Your name</label>
                    <input id="newsletter-name" class="footer-input" type="text" name="contact-name" placeholder="Your name" required>
                    <label class="sr-only" for="newsletter-email">Your email</label>
                    <input id="newsletter-email" class="footer-input" type="email" name="contact-email" placeholder="Email address" required>
                    <button type="submit" class="footer-submit">Sign up</button>
                </form>
            </div>
        </div>
    </footer>
</body>
</html>
